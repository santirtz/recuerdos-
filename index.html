<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuerdos ❤️</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/inicio.css">
    <link rel="stylesheet" href="css/albumes.css">
    <link rel="stylesheet" href="css/timeline.css">
    <link rel="stylesheet" href="css/animaciones.css">
</head>

<body>

    <!-- Pantalla de inicio -->
    <section id="inicio">

        <div class="login">

            <h1>Recuerdos ❤️</h1>

            <p class="frase">
                "Cada fotografía es una forma de volver a abrazarte,
                incluso cuando solo existe el recuerdo."
            </p>

            <input
                type="password"
                id="clave"
                placeholder="Nuestra fecha especial">

            <button onclick="entrar()">
                Entrar
            </button>

        </div>

    </section>

    <!-- Página principal -->
    <main id="pagina">

        <header>

            <h1>Recuerdos ❤️</h1>

            <nav>

                <button onclick="mostrarAlbumes()">
                    📷 Álbumes
                </button>

                <button onclick="mostrarTimeline()">
                    📅 Línea de tiempo
                </button>

                <button onclick="mostrarMusica()">
                    🎵 Música
                </button>

                <button onclick="mostrarCarta()">
                    💌 Carta
                </button>

            </nav>

        </header>

        <section id="contenido">

            <!-- Aquí aparecerá el contenido dinámicamente -->

        </section>

    </main>

    <script src="js/app.js"></script>
    <script src="js/albumes.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/spotify.js"></script>
    <script src="js/carta.js"></script>
    <script src="js/animaciones.js"></script>
    <script src="js/visor.js"></script>

</body>

</html>
